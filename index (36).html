<style>

:root[data-theme="dark"]{--bg:#0a0e17;--cd:#121826;--tx:#e7ecf6;--mu:#8794ab;--bd:#1f2937;--ac:#4f6bff;--up:#34d399;--dn:#ff7b7f;--wa:#f0b429;--sh:0 10px 30px rgba(0,0,0,.35);--hg1:#18266b;--hg2:#3a56d6}

body{margin:0;background:var(--bg) radial-gradient(900px 380px at 50% -140px,color-mix(in srgb,var(--ac) 14%,transparent),transparent) no-repeat;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:110px}

.br{display:flex;align-items:center;gap:10px}.mk{color:#fff;background:linear-gradient(135deg,var(--hg1),var(--hg2));padding:6px;border-radius:11px;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 40%,transparent)}

.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.g .c{margin:0;padding:14px 16px}

.big{font-size:clamp(32px,8vw,46px);font-weight:700;letter-spacing:-.035em;line-height:1.15;margin:2px 0 6px}.k{font-size:21px;font-weight:650;letter-spacing:-.02em}
.up{color:var(--up)}.dn{color:var(--dn)}.wa{color:var(--wa)}
.hero{background:linear-gradient(135deg,var(--hg1),var(--hg2));color:#fff;border:0;position:relative;overflow:hidden;padding:22px 20px}

.b.up,.b.dn,.b.wa{border-color:transparent;background:color-mix(in srgb,currentColor 13%,transparent)}

th{color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}tbody tr:hover,tr:hover td{background:color-mix(in srgb,var(--ac) 5%,transparent)}tr:last-child td{border-bottom:0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:38px;transition:background .15s,border-color .15s,transform .1s}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:active{transform:scale(.97)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button.p:hover{filter:brightness(1.08)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header button{border-radius:99px;padding:6px 14px;min-height:34px;font-size:13px}
.f{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}.f input,.f select{width:116px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--mu) 18%,transparent);margin:4px 0 8px}.bar i{display:block;background:var(--ac)}
.mt{height:6px;border-radius:99px;background:color-mix(in srgb,var(--mu) 18%,transparent);margin:8px 0;overflow:hidden}.mt i{display:block;height:100%;background:linear-gradient(90deg,var(--hg1),var(--hg2));border-radius:99px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:flex;gap:2px;padding:6px;background:color-mix(in srgb,var(--cd) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;box-shadow:0 12px 40px rgba(15,23,42,.18);z-index:10}

nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);font-weight:700}
.li{padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}.li.wa{border-left:3px solid var(--wa);padding-left:12px;border-radius:2px}
.chat{max-height:50vh;overflow:auto;display:flex;flex-direction:column}.chat .li{background:color-mix(in srgb,var(--mu) 11%,transparent);border:0;border-radius:16px 16px 16px 4px;padding:9px 13px;margin:5px 0;max-width:92%;align-self:flex-start}
.chat .me{background:var(--ac);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 13px;margin:5px 0;max-width:85%;align-self:flex-end;text-align:left}
.w{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}.w input{width:100%}
main>*{animation:in .35s ease both}main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(n+4){animation-delay:.12s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:820px){main{padding:12px 20px}.g{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div class="br"><svg class="mk" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><div><h1>INVEST.AI</h1><small>Seu patrimônio. Seus dados. Sua análise.</small></div></div><div class="f"><span class="b wa" id="bd">Dados fictícios (mock)</span><button id="lg">Entrar com Google</button><button data-a="th">Tema</button></div></header>
<main id="m"></main>
<nav id="nv"></nav>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),N=(v,d=1)=>v.toFixed(d).replace('.',','),P=v=>(v>=0?'+':'')+N(v,2)+'%',cl=v=>Math.max(0,Math.min(100,v)),cc=v=>v>=0?'up':'dn';
const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],CUR=9;
/* ===== Camada de provedores (troque a fonte sem mexer na UI) ===== */
const M12=v=>Array(12).fill(v),Q4=(v,ms)=>Array.from({length:12},(_,i)=>ms.includes(i)?v:0);
const MOCK={ts:'02/10/2026 17:00',
q:{PETR4:{p:38.2,d1:.8,d30:3.1,pl:5.2,pvp:1.3,roe:24,dy:12,dv:1,vol:32,liq:9,s:'Energia'},VALE3:{p:60.8,d1:-.6,d30:-2.4,pl:6.5,pvp:1.6,roe:20,dy:8,dv:.8,vol:28,liq:9,s:'Mineração'},ITUB4:{p:33.4,d1:.4,d30:2,pl:9,pvp:1.8,roe:21,dy:6,vol:22,liq:10,s:'Bancos'},BBAS3:{p:22.9,d1:-1.1,d30:-5,pl:4.5,pvp:.8,roe:19,dy:9,vol:26,liq:8,s:'Bancos'},HGLG11:{p:156.2,d1:-4.2,d30:-3.5,pvp:.98,dy:8.6,vol:14,liq:7,s:'Logística'},KNRI11:{p:158,d1:.1,d30:.8,pvp:.95,dy:7.9,vol:13,liq:6,s:'Híbrido'},MXRF11:{p:9.6,d1:-.2,d30:-.9,pvp:.97,dy:11.5,vol:12,liq:8,s:'Papel'}},
dps:{PETR4:Q4(1,[2,5,8,11]),VALE3:Q4(1.3,[2,8]),ITUB4:M12(.04),BBAS3:Q4(.9,[2,5,8,11]),HGLG11:M12(1.1),KNRI11:M12(.95),MXRF11:M12(.1)},
hist:[.86,.88,.87,.9,.92,.91,.94,.96,.95,.98,.99,1],
news:[{h:'Exemplo: companhia divulga resultado trimestral',f:'Fonte mock',ty:'FATO',tk:'PETR4',im:'Neutro',r:'Notícia fictícia só para demonstrar o formato.'},{h:'Exemplo: analista comenta setor bancário',f:'Fonte mock',ty:'OPINIÃO',tk:'ITUB4, BBAS3',im:'Incerto',r:'Opinião de terceiro, não é fato verificado.'},{h:'Exemplo: boato sobre operação de fusão',f:'Fonte mock',ty:'RUMOR',tk:'VALE3',im:'Não avaliado',r:'Rumor sem confirmação oficial. Não tratar como fato.'}]};
const Providers={market:{get:t=>MOCK.q[t]||null},dividend:{get:t=>MOCK.dps[t]||null},news:{all:()=>MOCK.news},updated:()=>MOCK.ts};
/* ===== Estado ===== */
const SEED=[['PETR4','Petrobras PN','Ação',200,34.5,0],['VALE3','Vale ON','Ação',100,62,0],['ITUB4','Itaú PN','Ação',300,30,33],['BBAS3','Banco do Brasil ON','Ação',150,25,0],['HGLG11','CGHG Logística','FII',40,160,0],['KNRI11','Kinea Renda Imob.','FII',30,155,0],['MXRF11','Maxi Renda','FII',500,10,0]].map(a=>({t:a[0],n:a[1],c:a[2],q:a[3],pm:a[4],alvo:a[5]}));
let S;try{S=JSON.parse(localStorage.getItem('investai'))}catch(e){}if(!S||!S.pos)S={pos:SEED,own:{}};
const save=()=>{try{localStorage.setItem('investai',JSON.stringify(S))}catch(e){}if(window.cloudSave)window.cloudSave(S)};
window.getS=()=>S;window.setS=v=>{S=v;try{localStorage.setItem('investai',JSON.stringify(S))}catch(e){}draw();loadLive()};
const mk=t=>Providers.market.get(t)||S.own[t]||null;
let V='home',PF='moderado',LIM=20,log=[];
const PR={conservador:{val:15,fund:15,qual:20,div:15,mom:0,risk:25,liq:10},moderado:{val:20,fund:20,qual:10,div:15,mom:15,risk:10,liq:10},arrojado:{val:15,fund:20,qual:5,div:5,mom:30,risk:5,liq:10},dividendos:{val:15,fund:10,qual:15,div:40,mom:5,risk:10,liq:5},valor:{val:40,fund:15,qual:15,div:10,mom:0,risk:10,liq:10},crescimento:{val:5,fund:35,qual:10,div:0,mom:30,risk:10,liq:10}};
const LB={val:'Valuation',fund:'Rentabilidade (ROE)',qual:'Endividamento',div:'Dividendos',mom:'Tendência 30d',risk:'Baixa volatilidade',liq:'Liquidez'};
function sc(t){const m=mk(t);if(!m)return{s:null,f:{}};const f={};
if(m.pvp!=null){const a=cl(100-(m.pvp-.8)*55);f.val=m.pl!=null?(a+cl(100-m.pl*6))/2:a}
if(m.roe!=null)f.fund=cl(m.roe*4);if(m.dv!=null)f.qual=cl(100-m.dv*35);if(m.dy!=null)f.div=cl(m.dy*8);
if(m.d30!=null)f.mom=cl(50+m.d30*5);if(m.vol!=null)f.risk=cl(100-m.vol*2.5);if(m.liq!=null)f.liq=cl(m.liq*10);
const w=PR[PF];let s=0,ws=0,n=0;for(const k in f){s+=w[k]*f[k];ws+=w[k];n++}
return{s:n<3||!ws?null:Math.round(s/ws),f}}
const cls=s=>s==null?['Sem dados suficientes','mu']:s>=70?['Oportunidade','up']:s>=50?['Neutro','']:s>=35?['Atenção','wa']:['Risco elevado','dn'];
function rows(){const r=S.pos.map(a=>{const m=mk(a.t),inv=a.q*a.pm,val=m?a.q*m.p:null;return{...a,m,inv,val,lp:val==null?null:val-inv,rt:val==null?null:val/inv-1}});
const tot=r.reduce((s,x)=>s+(x.val||0),0);r.forEach(x=>x.w=x.val==null?null:x.val/tot*100);return{r,tot,inv:r.reduce((s,x)=>s+x.inv,0)}}
function divs(){const by=Array(12).fill(0),pa={};let ano=0,prev=0;S.pos.forEach(a=>{const d=Providers.dividend.get(a.t);if(!d)return;pa[a.t]=0;d.forEach((v,i)=>{const x=v*a.q;by[i]+=x;if(i<=CUR){ano+=x;pa[a.t]+=x}else prev+=x})});return{by,mes:by[CUR],ano,prev,pa}}
function alerts(){const{r}=rows(),o=[];r.forEach(x=>{if(x.val==null){o.push(x.t+': dados temporariamente indisponíveis.');return}
if(x.m.d1<=-3)o.push(`${x.t} caiu ${N(Math.abs(x.m.d1))}% hoje.`);if(x.alvo&&x.m.p>=x.alvo)o.push(`${x.t} atingiu o preço definido por você (${R(x.alvo)}).`);
if(x.w>LIM)o.push(`Concentração elevada em ${x.t}: ${N(x.w)}% da carteira (limite ${LIM}%).`);if(Math.abs(x.rt)>=.15)o.push(`${x.t} está ${N(Math.abs(x.rt)*100)}% ${x.rt>0?'acima':'abaixo'} do seu preço médio.`)});return o}
function why(t){const{s,f}=sc(t),p=[],n=[],z=[];for(const k in LB){if(f[k]==null)z.push(LB[k]);else if(f[k]>=70)p.push(LB[k]+' favorável ('+Math.round(f[k])+')');else if(f[k]<=35)n.push(LB[k]+' fraco ('+Math.round(f[k])+')')}return{p,n,z}}
function st(x){const s=sc(x.t).s;if(s==null||x.w==null)return['Sem dados suficientes','indicadores ausentes'];if(x.w>LIM)return['Reduzir concentração',`peso ${N(x.w)}% acima do limite de ${LIM}%`];
if(s>=70)return['Comprar mais?',`score ${s} alto e peso ${N(x.w)}% dentro do limite`];if(s>=50)return['Manter em observação','score '+s+' neutro no perfil '+PF];return['Atenção','score '+s+' baixo no perfil '+PF]}
/* ===== Views ===== */
const foot=()=>`<p class="mu">Última atualização: ${Providers.updated()} · ${LIVEON?'Fonte: brapi (plano gratuito).':'Fonte: MOCK (fictícia).'}${LIVEON?' Dividendos e fundamentos reais exigem plano pago e aparecem como indisponíveis.':''} Estimativas e scores seguem regras configuráveis e não são recomendação de investimento. A decisão final é sua.</p>`;
function home(){const{r,tot,inv}=rows(),d=divs(),dd=r.reduce((s,x)=>s+(x.m?x.val-x.val/(1+x.m.d1/100):0),0),H=MOCK.hist,mes=(H[11]/H[10]-1)*100,ano=(H[11]/H[0]-1)*100,cs={};
r.forEach(x=>cs[x.c]=(cs[x.c]||0)+(x.val||0));const ks=Object.keys(cs),pts=H.map((v,i)=>(i*(300/11))+','+(70-(v-.84)/.16*60)).join(' '),al=alerts(),nw=Providers.news.all();
return`<div class="c hero"><small>Patrimônio total</small><div class="big">${R(tot)}</div><span class="${cc(dd)}">${dd>=0?'+':'−'}${R(Math.abs(dd))} (${P(dd/(tot-dd)*100)}) hoje</span> · <span class="${cc(mes)}">${P(mes)} mês</span> · <span class="${cc(ano)}">${P(ano)} ano</span><br><small>Mês/ano calculados sobre histórico fictício.</small></div>
<div class="g"><div class="c"><small>Valor investido</small><div class="k">${R(inv)}</div></div><div class="c"><small>Lucro/prejuízo</small><div class="k ${cc(tot-inv)}">${R(tot-inv)}</div></div><div class="c"><small>Rentabilidade</small><div class="k ${cc(tot-inv)}">${P((tot/inv-1)*100)}</div></div><div class="c"><small>Dividendos no mês</small><div class="k">${DR(d.mes)}</div></div><div class="c"><small>Dividendos no ano</small><div class="k">${DR(d.ano)}</div></div><div class="c"><small>Previstos</small><div class="k">${DR(d.prev)}</div></div><div class="c"><small>Ativos</small><div class="k">${r.length}</div></div></div>
<div class="c"><h2>Distribuição por classe</h2><div class="bar">${ks.map((k,i)=>`<i style="width:${cs[k]/tot*100}%;opacity:${1-i*.35}"></i>`).join('')}</div><small>${ks.map(k=>k+' '+N(cs[k]/tot*100)+'%').join(' · ')}</small></div>
<div class="c"><h2>Evolução do patrimônio (histórico fictício)</h2><svg viewBox="0 0 300 80" width="100%" height="90" role="img" aria-label="Evolução do patrimônio"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2"/></svg></div>
<div class="c"><h2>Alertas</h2>${al.length?al.map(a=>`<div class="li wa">⚠ ${esc(a)}</div>`).join(''):'<small>Nenhum alerta ativo.</small>'}</div>
<div class="c"><h2>Ranking da carteira (score ${PF})</h2>${[...r].sort((a,b)=>(sc(b.t).s??-1)-(sc(a.t).s??-1)).map(x=>{const s=sc(x.t).s;return`<div class="li"><b>${esc(x.t)}</b> <span class="b ${cls(s)[1]}">${s??'—'}</span> <small>${cls(s)[0]}</small></div>`}).join('')}</div>
<div class="c"><h2>Notícias (exemplos fictícios)</h2>${nw.map(n=>`<div class="li"><span class="b">${n.ty}</span> <b>${esc(n.h)}</b><br><small>${esc(n.f)} · ${esc(n.tk)} · Impacto: ${esc(n.im)}</small><br><small>${esc(n.r)}</small></div>`).join('')}</div>`+foot()}
function cart(){const{r}=rows();
return`<div class="c sc"><table><tr><th>Ativo</th><th>Tipo</th><th>Qtd</th><th>PM</th><th>Cotação</th><th>Valor</th><th>L/P</th><th>Rent.</th><th>Peso</th><th></th></tr>${r.map((x,i)=>`<tr><td><b>${esc(x.t)}</b><br><small>${esc(x.n)}</small></td><td>${esc(x.c)}</td><td>${x.q}</td><td>${R(x.pm)}</td><td>${x.m?R(x.m.p):'<small>indisponível</small>'}</td><td>${x.val==null?'—':R(x.val)}</td><td class="${x.lp==null?'':cc(x.lp)}">${x.lp==null?'—':R(x.lp)}</td><td class="${x.rt==null?'':cc(x.rt)}">${x.rt==null?'—':P(x.rt*100)}</td><td>${x.w==null?'—':N(x.w)+'%'}</td><td><button data-a="rm" data-i="${i}" aria-label="Remover ${esc(x.t)}">✕</button></td></tr>`).join('')}</table></div>
<div class="c"><h2>Cadastrar ativo</h2><div class="f"><label>Ticker<input id="nt" maxlength="12"></label><label>Tipo<select id="nc"><option>Ação</option><option>FII</option><option>ETF</option><option>BDR</option><option>Cripto</option><option>Renda Fixa</option></select></label><label>Quantidade<input id="nq" type="number" min="0" step="any"></label><label>Preço médio<input id="np" type="number" min="0" step="any"></label><label>Cotação atual (manual)<input id="nk" type="number" min="0" step="any"></label><button class="p" data-a="add">Adicionar</button></div><small id="ne" class="dn"></small><br><small>Sem provedor real, a cotação é informada por você. Sem cotação, o ativo aparece como indisponível. Dados ficam só neste navegador.</small> <button data-a="rs">Restaurar carteira de exemplo</button></div>`+foot()}
